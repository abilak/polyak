output_dir: results/theory_validation_smoke

noiseless:
  dimensions: [6]
  sparsities: [1, 2]
  upper_sparsity: 3
  budgets: [12, 24]
  seeds: [0, 1]
  radius: 1.0
  lipschitz: 1.0
  epsilon0: 1.0
  tau: 1.1
