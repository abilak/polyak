dataset: ncats_triple_example_smoke
workers: 2
prepared_data: data/processed/NCATS_screening_data.csv
output_dir: results/ncats_triple_example_smoke
budget: 30
seeds: [0, 1]
task_ids: all
algorithms:
  - name: sparse_ecp
    options: {epsilon0: 0.05, tau: 1.1, rejection_growth: 20}
  - support_random
  - random
  - name: ecp_uniform
    options: {epsilon0: 0.05, tau: 1.1, rejection_growth: 20}
  - name: space_filling
    options: {pool_size: 128}
  - name: gp_ucb
    options: {initial_points: 4, pool_size: 128}
